name: Check

on:
  pull_request:
  workflow_dispatch:
    inputs:
      storybook-runner:
        description: Runner image for the Storybook job
        type: choice
        options: [ubuntu-24.04, ubuntu-24.04-arm]
        default: ubuntu-24.04

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    # Release PRs run the full gate in release-check.yml.
    if: ${{ !startsWith(github.head_ref, 'chore/release-') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - run: bun run check:coss
      - run: bun run boundaries:check
      - run: bun run overrides:check
      - run: bun run typecheck
      - run: bun run lint:ci
      - run: bun run storybook:typecheck
      - run: bun run storybook:lint
      - run: bun run test
      - run: bun run build
      - run: bun run verify:public-api

  storybook:
    if: ${{ !startsWith(github.head_ref, 'chore/release-') }}
    runs-on: ${{ inputs.storybook-runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      # On pull_request HEAD is the merge commit, so HEAD^1 is the base it merges into.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Pick the lane
        id: lane
        env:
          EVENT: ${{ github.event_name }}
        run: |
          global='^(package\.json|bun\.lock|\.github/workflows/|apps/storybook/(\.storybook/|package\.json|vite\.config\.ts|vitest\.config\.ts)|apps/example/packages/ui/src/styles\.css)'
          stories='^(apps/storybook/|apps/example/packages/ui/|packages/)'
          storybook_build='^apps/storybook/(.*\.mdx$|\.storybook/)'
          docs_build='^apps/docs/'

          if [ "$EVENT" != pull_request ]; then
            files=''
            tests=full
          else
            files=$(git diff --name-only HEAD^1 HEAD)
            if grep -qE "$global" <<<"$files"; then tests=full
            elif grep -qE "$stories" <<<"$files"; then tests=changed
            else tests=skip
            fi
          fi

          has() { [ "$tests" = full ] || grep -qE "$1" <<<"$files" && echo true || echo false; }
          sb=$(has "$storybook_build")
          docs=$(has "$docs_build")
          install=$([ "$tests" != skip ] || [ "$sb" = true ] || [ "$docs" = true ] && echo true || echo false)
          {
            echo "tests=$tests"
            echo "storybook-build=$sb"
            echo "docs-build=$docs"
            echo "install=$install"
          } | tee -a "$GITHUB_OUTPUT"

      - if: steps.lane.outputs.install == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - if: steps.lane.outputs.install == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - if: steps.lane.outputs.install == 'true'
        run: bun install --frozen-lockfile

      - if: steps.lane.outputs.tests != 'skip'
        run: bunx playwright install --with-deps --only-shell chromium
        working-directory: apps/storybook

      - if: steps.lane.outputs.tests == 'changed'
        run: bun run test --project storybook --changed HEAD^1 --passWithNoTests
        working-directory: apps/storybook

      - if: steps.lane.outputs.tests == 'full'
        run: bun run test
        working-directory: apps/storybook

      - if: steps.lane.outputs.storybook-build == 'true'
        run: bun run storybook:build

      - if: steps.lane.outputs.docs-build == 'true'
        run: bun run docs:build
