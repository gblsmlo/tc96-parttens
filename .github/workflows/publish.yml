name: Publish

on:
  push:
    branches: [main]
    paths:
      - packages/registry/src/build-registry.ts
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Resolve the version to release
        id: version
        run: |
          version=$(node -p "require('./dist/cli/package.json').version")
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "Tag $tag already exists; nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$(npm view "@tc96/cli@$version" version 2>/dev/null)" ]; then
            echo "@tc96/cli@$version is already on npm; only the GitHub release is missing"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.publish == 'true'
        run: bun run typecheck

      - if: steps.version.outputs.publish == 'true'
        run: bun run test

      - if: steps.version.outputs.publish == 'true'
        run: bun run pack:check

      - if: steps.version.outputs.publish == 'true'
        run: npm publish --access public --provenance --tag latest
        working-directory: dist/cli

      - if: steps.version.outputs.release == 'true'
        name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes --latest --title "$TAG"
