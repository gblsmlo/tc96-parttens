name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Check the release commit is on main
        run: git merge-base --is-ancestor HEAD origin/main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run test

      - run: bun run build

      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./dist/cli/package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match package version $version" >&2
            exit 1
          fi

      - run: bun run pack:check

      - run: npm publish ./dist/cli --access public --provenance --tag latest
